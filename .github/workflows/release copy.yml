name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare macOS signing certificate
        if: runner.os == 'macOS'
        id: mac-signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required macOS release secret: $name"
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/mac-certificate.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$certificate_path"
          if [ ! -s "$certificate_path" ]; then
            echo "Failed to decode CSC_LINK into a certificate file"
            exit 1
          fi
          echo "certificate_path=$certificate_path" >> "$GITHUB_OUTPUT"

      - name: Build and Release macOS
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ steps.mac-signing.outputs.certificate_path }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run release:ci -- -c.mac.forceCodeSigning=true -c.mac.notarize=true

      - name: Build and Release
        if: runner.os != 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:ci
