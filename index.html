<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄时钟</title>
  <link rel="stylesheet" href="main.css">
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen select-none font-sans text-gray-800">
  <div class="bg-white p-8 rounded-xl shadow-lg w-80 text-center">
    <h1 class="text-2xl font-bold text-red-600 mb-4">🍅 番茄时钟</h1>
    
    <div id="timer" class="text-6xl font-bold my-4 text-gray-800 tabular-nums">25:00</div>
    
    <div class="mb-6 text-gray-500" id="status-text">准备开始专注</div>

    <div class="flex justify-between gap-3 mb-6">
      <button id="start-btn" class="flex-1 py-2 px-4 rounded-md transition bg-green-500 text-white hover:bg-green-600 disabled:opacity-50 disabled:cursor-not-allowed active:opacity-80 disabled:active:opacity-50 cursor-pointer">开始</button>
      <button id="pause-btn" class="flex-1 py-2 px-4 rounded-md transition bg-yellow-400 text-yellow-900 hover:bg-yellow-500 disabled:opacity-50 disabled:cursor-not-allowed active:opacity-80 disabled:active:opacity-50 cursor-pointer" disabled>暂停</button>
      <button id="reset-btn" class="flex-1 py-2 px-4 rounded-md transition bg-red-500 text-white hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed active:opacity-80 disabled:active:opacity-50 cursor-pointer">重置</button>
    </div>

    <div class="flex flex-col gap-3 text-left border-t border-gray-200 pt-4">
      <label class="flex justify-between items-center text-sm">
        专注时长 (分钟):
        <input type="number" id="work-time" value="25" min="1" max="60" class="w-16 p-1 border border-gray-300 rounded text-center focus:outline-none focus:ring-2 focus:ring-blue-400">
      </label>
      <label class="flex justify-between items-center text-sm">
        休息时长 (分钟):
        <input type="number" id="break-time" value="5" min="1" max="30" class="w-16 p-1 border border-gray-300 rounded text-center focus:outline-none focus:ring-2 focus:ring-blue-400">
      </label>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
